services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skibooking}
      POSTGRES_USER: ${POSTGRES_USER:-skibooking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skibooking_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skibooking} -d ${POSTGRES_DB:-skibooking}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:

