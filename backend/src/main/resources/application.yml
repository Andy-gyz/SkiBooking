spring:
    application:
        name: SkiBookingBackend
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/skibooking}
        username: ${DB_USERNAME:skibooking}
        password: ${DB_PASSWORD:skibooking_dev}
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
    flyway:
        enabled: true

server:
    port: ${SERVER_PORT:8080}

management:
    endpoints:
        web:
            exposure:
                include: health,info

app:
    local-admin:
        email: ${LOCAL_ADMIN_EMAIL:}
        password: ${LOCAL_ADMIN_PASSWORD:}
    stripe:
        api-key: ${STRIPE_SECRET_KEY:}
        webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    email-verification:
        api-key: ${RESEND_API_KEY:}
        from: ${EMAIL_FROM:Snow Alpine <onboarding@resend.dev>}
        code-ttl: PT${EMAIL_VERIFICATION_TTL_MINUTES:10}M
        resend-cooldown: ${EMAIL_VERIFICATION_RESEND_COOLDOWN:PT1M}
        max-attempts: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
    security:
        jwt:
            secret: ${JWT_SECRET}
            issuer: ${JWT_ISSUER:skibooking-api}
            access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}
        cors:
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
